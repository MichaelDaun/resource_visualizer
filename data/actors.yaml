# --- Nationellt & EU ---

- id: tillvaxtverket
  name: Tillväxtverket
  type: public-agency
  description: Statlig myndighet för regional tillväxt och företagande. Förvaltar EU:s regionalfond i Sverige och koordinerar Enterprise Europe Network.
  website: https://tillvaxtverket.se

- id: vinnova
  name: Vinnova
  type: public-agency
  description: Sveriges innovationsmyndighet. Finansierar forsknings- och innovationsprojekt och inkubatorer.
  website: https://www.vinnova.se

- id: rise
  name: RISE
  type: research-institute
  description: Statligt forskningsinstitut med särskilt fokus på att stötta små och medelstora företag i deras innovationsprocesser. Har regional kontakt i Kalmar län.
  website: https://www.ri.se/sv

- id: business-sweden
  name: Business Sweden
  type: public-agency
  description: Hjälper svenska företag att öka sin globala försäljning med exportrådgivning, kontakter och marknadsanalyser.
  website: https://www.business-sweden.com/sv/

- id: ekn
  name: Exportkreditnämnden
  type: public-agency
  description: Myndighet som erbjuder garantier för betalning och finansiering vid export.
  website: https://www.ekn.se

- id: energimyndigheten
  name: Energimyndigheten
  type: public-agency
  description: Har stöd och bidrag att söka på energiområdet.
  website: https://www.energimyndigheten.se/om-oss/stod-och-bidrag-att-soka-pa-energiomradet/

- id: naturvardsverket
  name: Naturvårdsverket
  type: public-agency
  description: Ansvarar för Klimatklivet, stöd till investeringar som minskar utsläppen.
  website: https://www.naturvardsverket.se

- id: eu-erdf
  name: Europeiska regionala utvecklingsfonden
  type: eu-fund
  description: EU:s regionalfond (ERUF) som bland annat finansierar projekt för konkurrenskraft i små och medelstora företag.
  website: https://tillvaxtverket.se/eu-program/regionalfonden.html
