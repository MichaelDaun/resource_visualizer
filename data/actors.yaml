# Organisations that run, fund or take part in support for SMEs.
# See docs/DATA.md for all fields and allowed values.
#
# Actors without `locations` (national agencies, EU funds) are shown in the
# "Nationellt & EU" box next to the map. Coordinates are approximate.

# --- Kalmar län ---

- id: region-kalmar
  name: Region Kalmar län
  type: region
  description: Regionalt utvecklingsansvar i Kalmar län, bland annat för näringsliv, innovation och regionala företagsstöd. Medfinansierar flera projekt riktade till små och medelstora företag.
  website: https://regionkalmar.se
  locations:
    - { place: Kalmar, lat: 56.6614, lng: 16.3628 }

- id: linnaeus-university
  name: Linnéuniversitetet
  type: university
  description: Universitet i Kalmar och Växjö som driver flera projekt i samverkan med små och medelstora företag, bland annat inom digitalisering, energi och hållbart byggande.
  website: https://lnu.se
  locations:
    - { place: Kalmar, lat: 56.6655, lng: 16.3655 }
    - { place: Växjö, lat: 56.8555, lng: 14.8275 }

- id: almi-kalmar
  name: Almi Kalmar län
  type: business-support
  description: Erbjuder lån, riskkapital och affärsrådgivning till företag i länet.
  website: https://www.almi.se/kalmar/
  locations:
    - { place: Kalmar, lat: 56.6600, lng: 16.3570 }

- id: kalmar-science-park
  name: Kalmar Science Park
  type: science-park
  description: Science park och inkubator på Varvsholmen i Kalmar för idébärare och nystartade företag, i samarbete med näringslivet och Linnéuniversitetet.
  website: https://kalmarsciencepark.se
  locations:
    - { place: Kalmar, lat: 56.6588, lng: 16.3702 }

- id: kalmar-municipality
  name: Kalmar kommun
  type: municipality
  description: Kommunens näringslivsarbete och företagsservice.
  website: https://kalmar.se
  locations:
    - { place: Kalmar, lat: 56.6634, lng: 16.3567 }

- id: additive-tech-center
  name: Additivt Teknikcenter i Hultsfred
  type: science-park
  description: Kunskapsnav för additiv tillverkning (3D-printing) i plast och metall. Erbjuder företag tillgång till utrustning, uppdragsutbildning och utvecklingsprojekt.
  website: https://www.atcab.se
  locations:
    - { place: Hultsfred, lat: 57.4855, lng: 15.8330 }

- id: hultsfred-municipality
  name: Hultsfreds kommun
  type: municipality
  website: https://www.hultsfred.se
  locations:
    - { place: Hultsfred, lat: 57.4887, lng: 15.8435 }

