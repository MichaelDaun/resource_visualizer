# Organisations that run, fund or take part in support for SMEs.
# See docs/DATA.md for all fields and allowed values.
#
# Actors without `locations` (national agencies, EU funds) are shown in the
# "Nationellt och EU" box next to the map. Coordinates come from street
# addresses where known (geocoded with OpenStreetMap or hitta.se), otherwise
# the town. `building` links a location to its OpenStreetMap building, which
# is highlighted on the map; run `npm run buildings` after changing one.
#
# Main sources: Region Kalmar län, "Företagsstödjande aktörer i Kalmar län";
# Region Kronoberg, "Stöd till företagsutveckling"; Växjö kommun,
# "Företagsfrämjare"; the actors' own websites.

# --- Kalmar län ---

- id: region-kalmar
  name: Region Kalmar län
  type: region
  description: Regionalt utvecklingsansvar i Kalmar län. Små och medelstora företag kan söka bidrag för att utveckla företaget, och regionen medfinansierar flera projekt för länets företag.
  website: https://utveckling.regionkalmar.se/utvecklingsomraden/naringsliv-och-innovation/foretagsstodjande-aktorer-i-kalmar-lan/
  locations:
    - { place: Kalmar, lat: 56.6614, lng: 16.3628 }

- id: linnaeus-university
  name: Linnéuniversitetet
  type: university
  description: Universitet i Kalmar och Växjö som driver flera projekt för kompetensuppbyggnad i små och medelstora företag, bland annat inom IoT, AI, automation, energi och hållbart byggande.
  website: https://lnu.se/mot-linneuniversitetet/Organisation/fakulteten-for-teknik/stod-for-sma-och-medelstora-foretag-i-linneregionen-for-att-starka-teknisk-kompetens-och-konkurrenskraft/
  locations:
    - { place: Kalmar, lat: 56.6606, lng: 16.3622 }
    - { place: Växjö, lat: 56.8547, lng: 14.8311 }

- id: almi-kalmar
  name: Almi Kalmar län
  type: business-support
  description: Hjälper små och medelstora företag att utvecklas genom finansiering, riskkapital och affärsutveckling.
  website: https://www.almi.se/kalmar/
  locations:
    - { place: Kalmar, lat: 56.6600, lng: 16.3570 }

- id: kalmar-science-park
  name: Kalmar Science Park
  type: science-park
  description: Science park på Varvsholmen i Kalmar som driver länets regionala inkubator för nystartade och unga företag.
  website: https://kalmarsciencepark.se
  locations:
    - { place: Kalmar, lat: 56.66983, lng: 16.37770, building: way/91666351 }

- id: iuc-kalmar
  name: IUC Kalmar län
  type: business-support
  description: Industriellt utvecklingscentrum som arbetar för ökad konkurrenskraft och kompetensutveckling hos länets industriföretag, bland annat inom automation, digitalisering, robotisering och nya material.
  website: https://iuc-kalmar.se
  locations:
    - { place: Kalmar, lat: 56.66983, lng: 16.37770, building: way/91666351 }

- id: atrinova
  name: Atrinova affärsutveckling
  type: business-support
  description: Stöttar idérika personer som vill starta, etablera och utveckla företag eller innovationer i norra Kalmar län. Rådgivningen är kostnadsfri och sker under sekretess.
  website: https://www.atrinova.se
  locations:
    - { place: Oskarshamn, lat: 57.2634, lng: 16.4554 }

- id: nfc-kalmarsund
  name: Nyföretagarcentrum Kalmarsund
  type: business-support
  description: Kostnadsfri och konfidentiell rådgivning till nyföretagare i södra Kalmar län.
  website: https://nyforetagarcentrum.se/kalmarsund/
  locations:
    - { place: Kalmar, lat: 56.6622, lng: 16.3598 }

- id: coompanion-kalmar
  name: Coompanion Kalmar län
  type: business-support
  description: Kostnadsfri rådgivning för den som vill utveckla en idé eller ett företag tillsammans med andra, till exempel som kooperativ eller inom den sociala ekonomin.
  website: https://coompanion.se/kalmar-lan/
  locations:
    - { place: Kalmar, lat: 56.6640, lng: 16.3590 }

- id: ehealth-arena
  name: eHealth Arena
  type: science-park
  description: Arbetar för ökat användande av e-hälsotjänster och för näringslivstillväxt inom e-hälsa i Kalmar län.
  website: https://www.ehealtharena.se/malgrupper/naringsliv/
  locations:
    - { place: Kalmar, lat: 56.6680, lng: 16.3640 }

- id: kalmar-municipality
  name: Kalmar kommun
  type: municipality
  description: Kommunens näringslivsarbete och företagsservice.
  website: https://kalmar.se
  locations:
    - { place: Kalmar, lat: 56.6634, lng: 16.3567 }

- id: additive-tech-center
  name: Additivt Teknikcenter i Hultsfred
  type: science-park
  description: Kunskapsnav för additiv tillverkning (3D-printing) i plast och metall. Erbjuder företag tillgång till utrustning, uppdragsutbildning och utvecklingsprojekt.
  website: https://www.atcab.se
  locations:
    - { place: Hultsfred, lat: 57.48784, lng: 15.83486, building: way/617886929 }

- id: hultsfred-municipality
  name: Hultsfreds kommun
  type: municipality
  website: https://www.hultsfred.se
  locations:
    - { place: Hultsfred, lat: 57.4887, lng: 15.8435 }

